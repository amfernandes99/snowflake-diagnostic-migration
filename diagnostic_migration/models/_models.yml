version: 2

models:
  - name: replacement_diagnostics
    description: "Replacement diagnostic data formatted for legacy reporting."

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - VEHICLE_ID
              - DID_ID
              - RECORDED_AT

    columns:
      - name: VEHICLE_ID
        data_tests:
          - not_null

      - name: DID_ID
        data_tests:
          - not_null

      - name: RECORDED_AT
        data_tests:
          - not_null